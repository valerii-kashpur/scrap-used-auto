version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - scraper-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - db
    volumes:
      - ./logs:/app/logs
      - ./dumps:/app/dumps
    environment:
      - POSTGRES_HOST=db
    networks:
      - scraper-network

networks:
  scraper-network:
    driver: bridge

volumes:
  postgres_data: